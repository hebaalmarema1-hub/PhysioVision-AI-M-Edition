<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>التقييم الشامل - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
}

.box{
background:rgba(255,255,255,0.12);
max-width:700px;
margin:30px auto;
padding:30px;
border-radius:20px;
}

input, textarea, select{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:10px;
}

textarea{
height:90px;
}

button{
background:white;
color:#1b6ca8;
padding:15px 35px;
border:none;
border-radius:25px;
font-size:18px;
margin:10px;
}

</style>

</head>

<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>📋 التقييم الشامل للحالة</h1>

<p>
PhysioVision AI – M² Edition
</p>


<div class="box">

<h2>بيانات التقييم</h2>

<input placeholder="اسم المريض">

<select>
<option>الفئة العمرية</option>
<option>أطفال</option>
<option>بالغون</option>
<option>كبار السن</option>
</select>


<select>
<option>اختيار التخصص</option>
<option>إصابات عظام</option>
<option>الأمراض العصبية</option>
<option>الإصابات الرياضية</option>
<option>ما بعد العمليات</option>
<option>تأهيل الأطفال</option>
<option>تأهيل كبار السن</option>
</select>


<select>
<option>التشخيص</option>
<option>خشونة الركبة</option>
<option>إصابة أربطة</option>
<option>آلام أسفل الظهر</option>
<option>باركنسون</option>
<option>السكتة الدماغية</option>
<option>ما بعد الكسور</option>
</select>


<h3>تقييم الألم</h3>

<select id="pain">
<option value="">درجة الألم (0 - 10)</option>
<option>0 - لا يوجد ألم</option>
<option>1</option>
<option>2</option>
<option>3 - ألم خفيف</option>
<option>4</option>
<option>5</option>
<option>6 - ألم متوسط</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10 - ألم شديد</option>
</select>


<h3>مدى الحركة ROM</h3>

<select id="joint">
<option>اختيار المفصل</option>
<option>الكتف</option>
<option>الكوع</option>
<option>الرسغ</option>
<option>الورك</option>
<option>الركبة</option>
<option>الكاحل</option>
</select>


<h3>قوة العضلات MMT</h3>

<select id="muscleStrength">
<option>درجة القوة 0 - 5</option>
<option>0/5 - لا يوجد انقباض</option>
<option>1/5 - انقباض بسيط</option>
<option>2/5 - حركة مع إزالة الجاذبية</option>
<option>3/5 - ضد الجاذبية</option>
<option>4/5 - ضد مقاومة متوسطة</option>
<option>5/5 - قوة طبيعية</option>
</select>


<h3>التوازن</h3>

<select id="balance">
<option>تقييم التوازن</option>
<option>طبيعي</option>
<option>ضعيف</option>
<option>متوسط</option>
<option>شديد الضعف</option>
</select>

<textarea placeholder="ملاحظات الأخصائي"></textarea>


<button onclick="saveEvaluation()">
حفظ التقييم
</button>

<button onclick="goBack()">
رجوع
</button>

</div>

</div>
<script>

let patientData = JSON.parse(localStorage.getItem("patientData"));

if(patientData){

document.querySelector('input[placeholder="اسم المريض"]').value =
patientData.name || "";

}


// حفظ التقييم

function saveEvaluation(){


let evaluationData = {

patientName: document.querySelector('input[placeholder="اسم المريض"]').value,

ageGroup: document.querySelectorAll("select")[0].value,

category: document.querySelectorAll("select")[1].value,

diagnosis: document.querySelectorAll("select")[2].value,

pain: document.getElementById("pain").value,

joint: document.getElementById("joint").value,

muscleStrength: document.getElementById("muscleStrength").value,

balance: document.getElementById("balance").value,

notes: document.querySelector("textarea").value

};



localStorage.setItem(
"evaluationData",
JSON.stringify(evaluationData)
);



window.location.href="movement.html";


}



function goBack(){

window.location.href="dashboard.html";

}


</script>
</body>

</html>
