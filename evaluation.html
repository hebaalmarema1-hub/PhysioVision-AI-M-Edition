<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>التقييم الشامل - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
}

.box{
background:rgba(255,255,255,0.12);
max-width:700px;
margin:30px auto;
padding:30px;
border-radius:20px;
}

input, textarea, select{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:10px;
}

textarea{
height:90px;
}

button{
background:white;
color:#1b6ca8;
padding:15px 35px;
border:none;
border-radius:25px;
font-size:18px;
margin:10px;
}

</style>

</head>

<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>📋 التقييم الشامل للحالة</h1>

<p>
PhysioVision AI – M² Edition
</p>


<div class="box">

<h2>بيانات التقييم</h2>

<input placeholder="اسم المريض">

<select>
<option>الفئة العمرية</option>
<option>أطفال</option>
<option>بالغون</option>
<option>كبار السن</option>
</select>


<select>
<option>اختيار التخصص</option>
<option>إصابات العظام</option>
<option>الأمراض العصبية</option>
<option>الإصابات الرياضية</option>
<option>ما بعد العمليات</option>
<option>تأهيل الأطفال</option>
<option>تأهيل كبار السن</option>
</select>


<select>
<option>التشخيص</option>
<option>خشونة الركبة</option>
<option>إصابات الأربطة</option>
<option>آلام أسفل الظهر</option>
<option>باركنسون</option>
<option>السكتة الدماغية</option>
<option>ما بعد الكسور</option>
</select>


<input placeholder="درجة الألم من 0 إلى 10">

<input placeholder="مدى الحركة ROM">

<input placeholder="قوة العضلات">

<input placeholder="التوازن">


<textarea placeholder="ملاحظات الأخصائي"></textarea>


<button onclick="saveEvaluation()">
حفظ التقييم
</button>

<button onclick="goBack()">
رجوع
</button>

</div>

</div>
<script>

function saveEvaluation(){


let evaluationData = {

patientName: document.querySelector('input[placeholder="اسم المريض"]').value,

ageGroup: document.querySelectorAll("select")[0].value,

category: document.querySelectorAll("select")[1].value,

diagnosis: document.querySelectorAll("select")[2].value,

pain: document.querySelectorAll("input")[1].value,

rom: document.querySelectorAll("input")[2].value,

muscleStrength: document.querySelectorAll("input")[3].value,

balance: document.querySelectorAll("input")[4].value,

notes: document.querySelector("textarea").value

};



localStorage.setItem(
"evaluationData",
JSON.stringify(evaluationData)
);



window.location.href="movement.html";


}



function goBack(){

window.location.href="dashboard.html";

}


</script>
</body>

</html>
