<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}

body{

background:
radial-gradient(circle at 50% 35%, #1b6ca8 0%, #102d52 45%, #061426 100%);

color:white;

}

/* الخلفية */

.background{

position:absolute;
inset:0;

background:
radial-gradient(circle at 20% 30%, rgba(0,210,255,.16), transparent 30%),
radial-gradient(circle at 80% 70%, rgba(0,120,255,.18), transparent 35%);

}

/* خطوط الذكاء الاصطناعي */

.network{

position:absolute;
inset:0;

opacity:.22;

background-image:

linear-gradient(
90deg,
transparent 49%,
rgba(100,220,255,.18) 50%,
transparent 51%
),

linear-gradient(
0deg,
transparent 49%,
rgba(100,220,255,.12) 50%,
transparent 51%
);

background-size:90px 90px;

animation:moveGrid 18s linear infinite;

}

@keyframes moveGrid{

from{
transform:translate(0,0);
}

to{
transform:translate(90px,90px);
}

}


/* النقاط */

.particle{

position:absolute;

width:5px;
height:5px;

background:#8eeaff;

border-radius:50%;

box-shadow:
0 0 12px #5eeaff,
0 0 25px #2ab9ff;

animation:float 6s infinite ease-in-out;

}

.p1{top:20%;left:15%;}
.p2{top:35%;left:82%;animation-delay:1s;}
.p3{top:72%;left:18%;animation-delay:2s;}
.p4{top:80%;left:78%;animation-delay:3s;}
.p5{top:18%;left:70%;animation-delay:4s;}

@keyframes float{

0%,100%{
transform:translateY(0);
opacity:.3;
}

50%{
transform:translateY(-25px);
opacity:1;
}

}


/* المحتوى */

.intro{

position:relative;

width:100%;
height:100%;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

z-index:5;

}


/* الصورة */

.photo{

position:relative;

width:min(760px,90vw);

height:min(58vh,600px);

display:flex;

align-items:center;
justify-content:center;

animation:
photoEnter 2s ease forwards,
photoFloat 6s ease-in-out 2s infinite;

}

.photo img{

width:100%;
height:100%;

object-fit:contain;

filter:

drop-shadow(0 0 20px rgba(80,220,255,.35))
drop-shadow(0 20px 40px rgba(0,0,0,.5));

-webkit-mask-image:
linear-gradient(
to bottom,
black 65%,
transparent 100%
);

mask-image:
linear-gradient(
to bottom,
black 65%,
transparent 100%
);

}


@keyframes photoEnter{

0%{
opacity:0;
transform:scale(1.12) translateY(30px);
filter:blur(12px);
}

100%{
opacity:1;
transform:scale(1);
filter:blur(0);
}

}

@keyframes photoFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}


/* هالة خلف الصورة */

.glow{

position:absolute;

width:65%;
height:55%;

background:#24cfff;

filter:blur(100px);

opacity:.12;

border-radius:50%;

z-index:-1;

}


/* النص */

.title{

margin-top:-20px;

font-size:clamp(28px,4vw,52px);

font-weight:bold;

letter-spacing:1px;

text-shadow:
0 0 20px rgba(100,220,255,.35);

animation:textEnter 2s ease .5s both;

}

.subtitle{

margin-top:12px;

font-size:clamp(18px,2.3vw,28px);

opacity:.92;

animation:textEnter 2s ease 1s both;

}

.quote{

margin-top:14px;

font-size:clamp(15px,1.8vw,22px);

opacity:.75;

font-style:italic;

animation:textEnter 2s ease 1.4s both;

}

@keyframes textEnter{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}


/* زر البداية */

.start{

margin-top:28px;

padding:15px 42px;

border:none;

border-radius:40px;

font-size:19px;

font-weight:bold;

cursor:pointer;

color:#0b1f3a;

background:white;

box-shadow:
0 0 20px rgba(255,255,255,.25),
0 10px 35px rgba(0,0,0,.25);

transition:.3s;

animation:
buttonEnter 2s ease 1.8s both;

}

.start:hover{

transform:scale(1.07);

box-shadow:
0 0 30px rgba(120,230,255,.7);

}

@keyframes buttonEnter{

from{

opacity:0;
transform:translateY(20px) scale(.9);

}

to{

opacity:1;
transform:translateY(0) scale(1);

}

}


/* انتقال للمنصة */

.fadeOut{

animation:fadeOut 1s forwards;

}

@keyframes fadeOut{

to{

opacity:0;
transform:scale(1.04);

}

}


/* الموبايل */

@media(max-width:600px){

.photo{

height:48vh;

}

.title{

font-size:28px;

}

.subtitle{

font-size:18px;

}

.quote{

font-size:15px;

padding:0 20px;

}

.start{

font-size:17px;

padding:13px 34px;

}

}

</style>

</head>


<body>


<div class="background"></div>

<div class="network"></div>


<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>


<div class="intro">


<div class="photo">

<div class="glow"></div>

<img src="IMG_0684.PNG">

</div>


<div class="title">

PhysioVision AI – M² Edition

</div>


<div class="subtitle">

من يدٍ صنعت فيّ البداية… إلى حلمٍ صنعناه معًا.

</div>


<div class="quote">

Transforming Movement into Measurable Recovery

</div>


<button
class="start"
onclick="startPlatform()">

متابعة

</button>


</div>


<script>

function startPlatform(){

document.body.classList.add("fadeOut");

setTimeout(function(){

window.location.href="welcome.html";

},900);

}

</script>


</body>

</html>
