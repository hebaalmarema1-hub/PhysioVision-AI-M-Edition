<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>تسجيل دخول الأخصائي - PhysioVision AI</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b1f3a, #1b6ca8);
    color: white;
    text-align: center;
}

.container {
    padding: 70px 20px;
}

.logo {
    width: 400px;
    height: 400px;
    object-fit: contain;
    border-radius: 20px;
}
.box {
    background: rgba(255,255,255,0.15);
    max-width: 400px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 20px;
}

input {
    width: 85%;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px 35px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #1b6ca8;
    font-size: 18px;
}

</style>

</head>

<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>تسجيل دخول الأخصائي</h1>

<p>
PhysioVision AI – M² Edition
</p>


<div class="box">

<input id="username" type="text" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">
<br>


<button onclick="loginDoctor()">
دخول
</button>

</div>

</div>
<script>

function loginDoctor(){

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;


if(username === "" || password === ""){

alert("يرجى إدخال اسم المستخدم وكلمة المرور");

return;

}


localStorage.setItem("doctorLogin", username);

window.location.href="dashboard.html";

}

</script>
</body>

</html>
