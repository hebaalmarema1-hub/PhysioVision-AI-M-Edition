<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>ملف المريض - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
}

.box{
background:rgba(255,255,255,0.12);
max-width:700px;
margin:30px auto;
padding:30px;
border-radius:20px;
}

input, textarea, select{
width:90%;
padding:12px;
margin:10px;
border:none;
border-radius:10px;
}

textarea{
height:80px;
}

button{
background:white;
color:#1b6ca8;
padding:15px 35px;
border:none;
border-radius:25px;
font-size:18px;
margin:10px;
}
document.getElementById("savePatient").onclick = function(){

alert("تم حفظ ملف المريض ✅");

};


document.getElementById("backBtn").onclick = function(){

window.history.back();

};
</style>

</head>

<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>👤 ملف المريض</h1>

<p>
PhysioVision AI – M² Edition
</p>


<div class="box">

<h2>البيانات الشخصية</h2>

<input placeholder="الاسم الكامل">

<input placeholder="العمر">

<select>
<option>الجنس</option>
<option>ذكر</option>
<option>أنثى</option>
</select>

<input placeholder="رقم الملف">

<input placeholder="رقم الهاتف">


<h2>التاريخ الطبي</h2>

<textarea placeholder="التاريخ المرضي"></textarea>

<textarea placeholder="الأمراض المزمنة"></textarea>

<textarea placeholder="العمليات السابقة"></textarea>

<textarea placeholder="الأدوية"></textarea>

<textarea placeholder="الحساسية"></textarea>


<button id="savePatient">
حفظ ملف
</button>

<button id="backBtn">
رجوع
</button>

</div>

</div>

</body>

</html>
