<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#1b6ca8">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Arial,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #0b1f3a,
        #1b6ca8
    );

    color:white;

    text-align:center;

}


/* الصفحة */

.container{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:40px 20px;

}


/* شعار المنصة */

.logo{

    width:280px;

    max-width:80vw;

    height:auto;

    object-fit:contain;

    border-radius:20px;

    margin-bottom:25px;

}


/* اسم المنصة */

h1{

    font-size:
    clamp(32px,5vw,50px);

    margin:
    0 0 10px;

}


/* الإصدار */

.edition{

    font-size:24px;

    margin-bottom:25px;

}


/* الوصف */

.description{

    max-width:700px;

    font-size:21px;

    line-height:1.9;

    margin:0 auto 15px;

}


/* الجملة الإنجليزية */

.quote{

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:17px;

    color:
    rgba(220,245,255,.9);

    margin-bottom:30px;

}


/* زر ابدأ المنصة */

.start-button{

    display:inline-block;

    padding:15px 45px;

    border:none;

    border-radius:30px;

    background:white;

    color:#1b6ca8;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    text-decoration:none;

    box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

}


/* زر التثبيت */

.install-button{

    display:none;

    margin-top:15px;

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#00c853;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


/* الهاتف */

@media(max-width:600px){

    .logo{

        width:220px;

    }

    .description{

        font-size:18px;

        line-height:1.8;

    }

    .edition{

        font-size:21px;

    }

    .quote{

        font-size:15px;

    }

    .start-button{

        font-size:17px;

        padding:14px 38px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- شعار المنصة -->

    <img
        src="IMG_0282.PNG"
        class="logo"
        alt="PhysioVision AI">


    <!-- اسم المنصة -->

    <h1>

        PhysioVision AI

    </h1>


    <!-- الإصدار -->

    <div class="edition">

        M² Edition

    </div>


    <!-- وصف المنصة -->

    <p class="description">

        منصة ذكية لتحليل الحركة ودعم
        التقييم والتأهيل الحركي
        باستخدام الذكاء الاصطناعي والرؤية الحاسوبية

    </p>


    <!-- الجملة الإنجليزية -->

    <div class="quote">

        Transforming Movement into Measurable Recovery

    </div>


    <!-- زر واحد فقط -->

   <a
    href="doctor.html"
    class="start-button">

    ابدأ المنصة

</a>

    <!-- زر تثبيت التطبيق -->

    <button
        id="installBtn"
        class="install-button">

        📱 تثبيت PhysioVision AI

    </button>


</div>


<script>

/* ==========================
   تثبيت التطبيق
========================== */

let deferredPrompt = null;

const installBtn =
document.getElementById("installBtn");


window.addEventListener(
"beforeinstallprompt",
function(event){

    event.preventDefault();

    deferredPrompt = event;

    installBtn.style.display =
    "inline-block";

});


installBtn.addEventListener(
"click",
async function(){

    if(!deferredPrompt){

        alert(
            "التثبيت غير متاح حاليًا. افتحي المنصة من Chrome ثم حاولي مرة أخرى."
        );

        return;

    }

    deferredPrompt.prompt();

    const result =
    await deferredPrompt.userChoice;

    console.log(
        "اختيار المستخدم:",
        result.outcome
    );

    deferredPrompt = null;

    installBtn.style.display =
    "none";

});


window.addEventListener(
"appinstalled",
function(){

    console.log(
        "تم تثبيت PhysioVision AI بنجاح"
    );

    installBtn.style.display =
    "none";

});

</script>


</body>

</html>
