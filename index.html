<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#1b6ca8">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Tahoma,
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 50% 40%,
        #1b6ca8 0%,
        #102d52 45%,
        #061426 100%
    );

    color:white;

    text-align:center;

    min-height:100vh;

    overflow-x:hidden;
}


/* الخلفية */

.background{

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle at 20% 25%,
        rgba(0,220,255,.18),
        transparent 32%
    ),

    radial-gradient(
        circle at 80% 75%,
        rgba(0,130,255,.20),
        transparent 35%
    );

    animation:
    backgroundPulse 8s ease-in-out infinite;

    pointer-events:none;
}

@keyframes backgroundPulse{

    0%,100%{
        opacity:.8;
    }

    50%{
        opacity:1;
    }

}


/* شبكة الذكاء الاصطناعي */

.network{

    position:fixed;

    inset:-100px;

    opacity:.16;

    background-image:

    linear-gradient(
        90deg,
        transparent 49%,
        rgba(130,230,255,.20) 50%,
        transparent 51%
    ),

    linear-gradient(
        0deg,
        transparent 49%,
        rgba(130,230,255,.14) 50%,
        transparent 51%
    );

    background-size:90px 90px;

    animation:
    moveGrid 20s linear infinite;

    pointer-events:none;
}

@keyframes moveGrid{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(90px,90px);
    }

}


/* النقاط */

.particle{

    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#9befff;

    box-shadow:
    0 0 10px #63e5ff,
    0 0 25px #20bfff;

    animation:
    particleFloat 7s ease-in-out infinite;

    pointer-events:none;
}

.p1{
    top:15%;
    left:12%;
}

.p2{
    top:30%;
    left:86%;
    animation-delay:1s;
}

.p3{
    top:75%;
    left:10%;
    animation-delay:2s;
}

.p4{
    top:82%;
    left:88%;
    animation-delay:3s;
}

.p5{
    top:12%;
    left:72%;
    animation-delay:4s;
}

.p6{
    top:55%;
    left:5%;
    animation-delay:2.5s;
}

.p7{
    top:48%;
    left:94%;
    animation-delay:4.5s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translateY(0) scale(1);
        opacity:.25;
    }

    50%{
        transform:translateY(-25px) scale(1.5);
        opacity:1;
    }

}


/* المحتوى */

.container{

    position:relative;

    z-index:10;

    width:min(850px,92vw);

    min-height:100vh;

    margin:auto;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:40px 20px;
}


/* اسم المنصة */

.title{

    font-size:
    clamp(32px,5vw,60px);

    font-weight:700;

    margin:0;

    line-height:1.3;

    text-shadow:
    0 0 30px rgba(255,255,255,.20);

    animation:
    textEnter 1.2s ease both;
}


/* النسخة */

.edition{

    margin-top:10px;

    font-size:
    clamp(20px,3vw,28px);

    letter-spacing:3px;

    color:
    rgba(220,248,255,.95);

    animation:
    textEnter 1.2s ease .25s both;
}


/* الوصف */

.description{

    max-width:700px;

    margin-top:25px;

    font-size:
    clamp(18px,2.5vw,24px);

    line-height:1.9;

    color:
    rgba(255,255,255,.92);

    animation:
    textEnter 1.2s ease .5s both;
}


/* البطاقة */

.card{

    width:min(700px,100%);

    margin-top:35px;

    padding:35px 25px;

    border-radius:30px;

    background:
    rgba(255,255,255,.09);

    border:
    1px solid rgba(255,255,255,.16);

    backdrop-filter:
    blur(15px);

    box-shadow:
    0 20px 70px rgba(0,0,0,.30),
    inset 0 1px rgba(255,255,255,.12);

    animation:
    cardEnter 1.3s ease .8s both;
}


/* زر ابدأ المنصة */

.start{

    display:inline-block;

    margin-top:10px;

    padding:16px 55px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #dff8ff
    );

    color:#0b2a4a;

    font-size:19px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
    0 0 25px rgba(130,230,255,.25),
    0 12px 35px rgba(0,0,0,.35);

    transition:
    transform .3s ease,
    box-shadow .3s ease;

    animation:
    buttonEnter 1.3s ease 1.1s both;
}

.start:hover{

    transform:
    translateY(-3px)
    scale(1.05);

    box-shadow:
    0 0 40px rgba(100,225,255,.65),
    0 15px 40px rgba(0,0,0,.4);
}


/* زر التثبيت */

.install{

    display:none;

    margin-top:20px;

    padding:13px 30px;

    border:none;

    border-radius:30px;

    background:#00c853;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


/* النص السفلي */

.footer{

    margin-top:30px;

    font-size:15px;

    color:
    rgba(255,255,255,.65);
}


/* الحركات */

@keyframes textEnter{

    from{

        opacity:0;

        transform:
        translateY(25px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}

@keyframes cardEnter{

    from{

        opacity:0;

        transform:
        translateY(35px)
        scale(.95);

    }

    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

    }

}

@keyframes buttonEnter{

    from{

        opacity:0;

        transform:
        translateY(20px)
        scale(.9);

    }

    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

    }

}


/* انتقال الصفحة */

.fadeOut{

    animation:
    pageFadeOut .8s ease forwards;
}

@keyframes pageFadeOut{

    to{

        opacity:0;

        transform:
        scale(1.03);

    }

}


/* الموبايل */

@media(max-width:600px){

    .container{

        padding:
        35px 18px;

    }

    .card{

        padding:
        28px 18px;

    }

    .start{

        width:90%;

        padding:
        14px 25px;

        font-size:17px;

    }

    .install{

        width:90%;

    }

}

</style>

</head>


<body>


<div class="background"></div>

<div class="network"></div>


<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>


<div class="container">


    <h1 class="title">

        PhysioVision AI

    </h1>


    <div class="edition">

        M² Edition

    </div>


    <p class="description">

        منصة ذكية لتحليل الحركة ودعم التقييم
        والتأهيل الحركي باستخدام الذكاء الاصطناعي
        والرؤية الحاسوبية

    </p>


    <div class="card">


        <h2>

            ابدأ المنصة

        </h2>


        <p>

            اضغطي على الزر لفتح منصة
            PhysioVision AI والانتقال إلى صفحة الترحيب.

        </p>


        <button
        class="start"
        onclick="openPlatform()">

            ابدأ المنصة

        </button>


        <br>


        <button
        id="installBtn"
        class="install">

            📱 تثبيت PhysioVision AI

        </button>


    </div>


    <div class="footer">

        Smart Movement Analysis & Rehabilitation Platform

    </div>


</div>


<script>


/* فتح المنصة */

function openPlatform(){

    document.body.classList.add("fadeOut");

    setTimeout(function(){

        window.location.href =
        "welcome.html";

    },800);

}


/* تشغيل التطبيق */

if("serviceWorker" in navigator){

    window.addEventListener(
    "load",
    function(){

        navigator.serviceWorker.register(
            "./service-worker.js"
        )

        .then(function(){

            console.log(
                "PhysioVision AI جاهز كتطبيق"
            );

        })

        .catch(function(error){

            console.log(
                "خطأ في تشغيل التطبيق:",
                error
            );

        });

    });

}


/* تثبيت التطبيق */

let deferredPrompt = null;

const installBtn =
document.getElementById("installBtn");


window.addEventListener(
"beforeinstallprompt",
function(event){

    event.preventDefault();

    deferredPrompt = event;

    installBtn.style.display =
    "inline-block";

});


installBtn.addEventListener(
"click",
async function(){

    if(!deferredPrompt){

        alert(
            "التثبيت غير متاح حاليًا. افتحي المنصة من Chrome ثم حاولي مرة أخرى."
        );

        return;

    }


    deferredPrompt.prompt();


    const result =
    await deferredPrompt.userChoice;


    console.log(
        "اختيار المستخدم:",
        result.outcome
    );


    deferredPrompt = null;

    installBtn.style.display =
    "none";

});


window.addEventListener(
"appinstalled",
function(){

    console.log(
        "تم تثبيت PhysioVision AI بنجاح"
    );

    installBtn.style.display =
    "none";

});


</script>


</body>

</html>
