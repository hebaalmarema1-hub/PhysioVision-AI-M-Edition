<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>PhysioVision AI – M² Edition</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#1b6ca8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0b1f3a, #1b6ca8);
    color: white;
    text-align: center;
}

.container {
    padding: 60px 20px;
}

.logo {
    width: 320px;
    max-width: 90%;
    border-radius: 25px;
    margin-bottom: 25px;
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
}

p {
    font-size: 22px;
    line-height: 1.8;
}

.card {
    background: rgba(255,255,255,0.1);
    margin: 40px auto;
    padding: 30px;
    border-radius: 20px;
    max-width: 700px;
}

button {
    background: white;
    color: #1b6ca8;
    border: none;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 18px;
    margin: 10px;
    cursor: pointer;
}

.install {
    display: none;
    background: #00c853;
    color: white;
}

</style>

</head>

<body>

<script>

if (!sessionStorage.getItem("introShown")) {

    sessionStorage.setItem("introShown", "yes");

    window.location.href = "intro.html";

}

</script>

<div class="container">
<p>
منصة ذكية لتحليل الحركة ودعم التقييم والتأهيل الحركي
باستخدام الذكاء الاصطناعي والرؤية الحاسوبية
</p>

<a href="login.html">
    <button>
        ابدأ المنصة
    </button>
</a>

<br>

<button id="installBtn" class="install">
📱 تثبيت PhysioVision AI
</button>

</div>

</div>


<script>

/* تشغيل التطبيق */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker.register("./service-worker.js")

        .then(function() {

            console.log("PhysioVision AI جاهز كتطبيق");

        })

        .catch(function(error) {

            console.log(
                "خطأ في تشغيل التطبيق:",
                error
            );

        });

    });

}


/* زر تثبيت التطبيق */

let deferredPrompt = null;

const installBtn =
document.getElementById("installBtn");


window.addEventListener(
"beforeinstallprompt",
function(event) {

    event.preventDefault();

    deferredPrompt = event;

    installBtn.style.display = "inline-block";

});


installBtn.addEventListener(
"click",
async function() {

    if (!deferredPrompt) {

        alert(
            "التثبيت غير متاح حاليًا. افتحي المنصة من Chrome ثم حاولي مرة أخرى."
        );

        return;

    }

    deferredPrompt.prompt();

    const result =
    await deferredPrompt.userChoice;

    console.log(
        "اختيار المستخدم:",
        result.outcome
    );

    deferredPrompt = null;

    installBtn.style.display = "none";

});


window.addEventListener(
"appinstalled",
function() {

    console.log(
        "تم تثبيت PhysioVision AI بنجاح"
    );

    installBtn.style.display = "none";

});

</script>


</body>

</html>
