<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 50% 40%,
        #1b6ca8 0%,
        #102d52 42%,
        #061426 100%
    );

    color:white;

}


/* الخلفية */

.background{

    position:absolute;

    inset:0;

    background:

    radial-gradient(
        circle at 20% 25%,
        rgba(0,220,255,.18),
        transparent 32%
    ),

    radial-gradient(
        circle at 80% 75%,
        rgba(0,130,255,.20),
        transparent 35%
    );

    animation:
    backgroundPulse 8s ease-in-out infinite;

}

@keyframes backgroundPulse{

    0%,100%{
        opacity:.8;
    }

    50%{
        opacity:1;
    }

}


/* شبكة الذكاء الاصطناعي */

.network{

    position:absolute;

    inset:-100px;

    opacity:.16;

    background-image:

    linear-gradient(
        90deg,
        transparent 49%,
        rgba(130,230,255,.20) 50%,
        transparent 51%
    ),

    linear-gradient(
        0deg,
        transparent 49%,
        rgba(130,230,255,.14) 50%,
        transparent 51%
    );

    background-size:90px 90px;

    animation:
    moveGrid 20s linear infinite;

}

@keyframes moveGrid{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(90px,90px);
    }

}


/* النقاط */

.particle{

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#9befff;

    box-shadow:
    0 0 10px #63e5ff,
    0 0 25px #20bfff;

    animation:
    particleFloat 7s ease-in-out infinite;

}

.p1{
    top:15%;
    left:12%;
}

.p2{
    top:30%;
    left:86%;
    animation-delay:1s;
}

.p3{
    top:75%;
    left:10%;
    animation-delay:2s;
}

.p4{
    top:82%;
    left:88%;
    animation-delay:3s;
}

.p5{
    top:12%;
    left:72%;
    animation-delay:4s;
}

.p6{
    top:55%;
    left:5%;
    animation-delay:2.5s;
}

.p7{
    top:48%;
    left:94%;
    animation-delay:4.5s;
}

@keyframes particleFloat{

    0%,100%{

        transform:
        translateY(0)
        scale(1);

        opacity:.25;

    }

    50%{

        transform:
        translateY(-25px)
        scale(1.5);

        opacity:1;

    }

}


/* المحتوى */

.content{

    position:relative;

    z-index:10;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

}


/* شعار المنصة */

.logo{

    width:
    min(190px,48vw);

    height:
    min(190px,48vw);

    object-fit:contain;

    border-radius:25px;

    margin-bottom:20px;

    filter:
    drop-shadow(
        0 15px 35px
        rgba(0,0,0,.35)
    );

    animation:
    logoEnter 1.5s ease both;

}

@keyframes logoEnter{

    from{

        opacity:0;

        transform:
        scale(.75)
        translateY(-20px);

    }

    to{

        opacity:1;

        transform:
        scale(1)
        translateY(0);

    }

}


/* اسم المنصة */

.title{

    font-size:
    clamp(32px,5vw,58px);

    font-weight:700;

    margin:0;

    line-height:1.3;

    text-shadow:
    0 5px 30px rgba(0,0,0,.45);

    animation:
    titleEnter 1.5s ease .3s both;

}

@keyframes titleEnter{

    from{

        opacity:0;

        transform:
        translateY(25px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


/* الإصدار */

.edition{

    margin-top:8px;

    font-size:
    clamp(20px,3vw,28px);

    letter-spacing:3px;

    color:
    rgba(220,245,255,.95);

    animation:
    editionEnter 1.5s ease .5s both;

}

@keyframes editionEnter{

    from{

        opacity:0;

        transform:
        translateY(20px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


/* الوصف */

.subtitle{

    margin-top:20px;

    max-width:750px;

    font-size:
    clamp(17px,2.4vw,25px);

    line-height:1.9;

    color:
    rgba(255,255,255,.92);

    animation:
    subtitleEnter 1.5s ease .7s both;

}

@keyframes subtitleEnter{

    from{

        opacity:0;

        transform:
        translateY(20px);

    }

    to{

        opacity:1;

        transform:
        translateY(0);

    }

}


/* الجملة */

.quote{

    margin-top:10px;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:
    clamp(14px,1.7vw,20px);

    letter-spacing:1px;

    color:
    rgba(190,240,255,.85);

    animation:
    quoteEnter 1.5s ease .9s both;

}

@keyframes quoteEnter{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


/* زر ابدأ المنصة */

.start-button{

    margin-top:30px;

    padding:
    15px 50px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #dff8ff
    );

    color:#0b2a4a;

    font-size:19px;

    font-weight:700;

    cursor:pointer;

    box-shadow:

    0 0 25px
    rgba(130,230,255,.25),

    0 12px 35px
    rgba(0,0,0,.35);

    transition:
    .3s;

    animation:
    buttonEnter 1.5s ease 1.1s both;

}

.start-button:hover{

    transform:
    translateY(-4px)
    scale(1.05);

    box-shadow:

    0 0 40px
    rgba(100,225,255,.65),

    0 15px 40px
    rgba(0,0,0,.4);

}

@keyframes buttonEnter{

    from{

        opacity:0;

        transform:
        translateY(20px)
        scale(.9);

    }

    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

    }

}


/* الانتقال */

.fade-out{

    animation:
    fadeOut .6s ease forwards;

}

@keyframes fadeOut{

    to{

        opacity:0;

        transform:
        scale(1.03);

    }

}


/* الهاتف */

@media(max-width:600px){

    .logo{

        width:150px;
        height:150px;

    }

    .title{

        font-size:30px;

    }

    .edition{

        font-size:20px;

    }

    .subtitle{

        font-size:17px;

        line-height:1.8;

    }

    .quote{

        font-size:14px;

    }

    .start-button{

        font-size:17px;

        padding:
        14px 42px;

    }

}

</style>

</head>


<body>


<div class="background"></div>

<div class="network"></div>


<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>


<div class="content">


    <!-- شعار المنصة -->

    <img
        src="IMG_0282.PNG"
        class="logo"
        alt="PhysioVision AI">


    <!-- اسم المنصة -->

    <div class="title">

        PhysioVision AI

    </div>


    <div class="edition">

        M² Edition

    </div>


    <div class="subtitle">

        منصة ذكية لتحليل الحركة ودعم
        التقييم والتأهيل الحركي
        باستخدام الذكاء الاصطناعي والرؤية الحاسوبية

    </div>


    <div class="quote">

        Transforming Movement into Measurable Recovery

    </div>


    <button
        class="start-button"
        onclick="startPlatform()">

        ابدأ المنصة

    </button>


</div>


<script>

function startPlatform(){

    document.body.classList.add("fade-out");

    setTimeout(function(){

        window.location.href =
        "welcome.html";

    },600);

}

</script>


</body>

</html>
