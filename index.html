<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Tahoma,
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 50% 40%,
        #1b6ca8 0%,
        #102d52 42%,
        #061426 100%
    );

    color:white;
}


/* الخلفية */

.background{
    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at 20% 25%,
        rgba(0,220,255,.18),
        transparent 32%
    ),

    radial-gradient(
        circle at 80% 75%,
        rgba(0,130,255,.20),
        transparent 35%
    );

    animation:backgroundPulse 8s ease-in-out infinite;
}

@keyframes backgroundPulse{

    0%,100%{
        opacity:.8;
    }

    50%{
        opacity:1;
    }

}


/* شبكة الذكاء الاصطناعي */

.network{

    position:absolute;
    inset:-100px;

    opacity:.16;

    background-image:

    linear-gradient(
        90deg,
        transparent 49%,
        rgba(130,230,255,.20) 50%,
        transparent 51%
    ),

    linear-gradient(
        0deg,
        transparent 49%,
        rgba(130,230,255,.14) 50%,
        transparent 51%
    );

    background-size:90px 90px;

    animation:
    moveGrid 20s linear infinite;
}

@keyframes moveGrid{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(90px,90px);
    }

}


/* النقاط */

.particle{

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#9befff;

    box-shadow:
    0 0 10px #63e5ff,
    0 0 25px #20bfff;

    animation:particleFloat 7s ease-in-out infinite;
}

.p1{
    top:15%;
    left:12%;
}

.p2{
    top:30%;
    left:86%;
    animation-delay:1s;
}

.p3{
    top:75%;
    left:10%;
    animation-delay:2s;
}

.p4{
    top:82%;
    left:88%;
    animation-delay:3s;
}

.p5{
    top:12%;
    left:72%;
    animation-delay:4s;
}

.p6{
    top:55%;
    left:5%;
    animation-delay:2.5s;
}

.p7{
    top:48%;
    left:94%;
    animation-delay:4.5s;
}

@keyframes particleFloat{

    0%,100%{
        transform:translateY(0) scale(1);
        opacity:.25;
    }

    50%{
        transform:translateY(-25px) scale(1.5);
        opacity:1;
    }

}


/* المحتوى */

.intro{

    position:relative;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    z-index:5;
}


/* الصورة */

.photo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:1;

    animation:
    photoEnter 2.2s ease forwards,
    photoFloat 8s ease-in-out 2.2s infinite;
}


.photo img{

    width:100%;
    height:100%;

    object-fit:contain;

    opacity:.52;

    transform:scale(1.08);

    filter:
    saturate(.85)
    contrast(.95)
    drop-shadow(0 0 30px rgba(70,220,255,.25))
    drop-shadow(0 25px 60px rgba(0,0,0,.55));

    -webkit-mask-image:
    radial-gradient(
        ellipse at center,
        black 35%,
        rgba(0,0,0,.9) 55%,
        transparent 88%
    );

    mask-image:
    radial-gradient(
        ellipse at center,
        black 35%,
        rgba(0,0,0,.9) 55%,
        transparent 88%
    );
}


@keyframes photoEnter{

    0%{
        opacity:0;
        transform:scale(1.16);
        filter:blur(15px);
    }

    100%{
        opacity:.52;
        transform:scale(1.08);
        filter:blur(0);
    }

}


@keyframes photoFloat{

    0%,100%{
        transform:scale(1.08) translateY(0);
    }

    50%{
        transform:scale(1.10) translateY(-8px);
    }

}


/* الهالة */

.glow{

    position:absolute;

    width:70%;
    height:65%;

    background:
    radial-gradient(
        circle,
        rgba(40,215,255,.45),
        rgba(30,130,255,.15),
        transparent 70%
    );

    filter:blur(70px);

    opacity:.35;

    border-radius:50%;

    z-index:-1;

    animation:glowPulse 6s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,100%{
        transform:scale(.95);
        opacity:.25;
    }

    50%{
        transform:scale(1.1);
        opacity:.45;
    }

}


/* طبقة فوق الصورة */

.photo::after{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(6,20,38,.05),
        rgba(6,20,38,.25) 55%,
        rgba(6,20,38,.88) 100%
    );

    pointer-events:none;
}


/* النص */

.text-content{

    position:relative;

    z-index:10;

    width:min(900px,92vw);

    margin-top:48vh;

    padding:0 20px;

    text-shadow:
    0 3px 20px rgba(0,0,0,.65);
}


.title{

    font-size:
    clamp(30px,4.5vw,58px);

    font-weight:700;

    letter-spacing:.5px;

    margin:0;

    line-height:1.3;

    color:#ffffff;

    animation:
    textEnter 1.5s ease .5s both;
}


.subtitle{

    margin-top:14px;

    font-size:
    clamp(19px,2.5vw,30px);

    font-weight:500;

    line-height:1.8;

    color:rgba(255,255,255,.95);

    animation:
    textEnter 1.5s ease .9s both;
}


.quote{

    margin-top:10px;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:
    clamp(14px,1.7vw,21px);

    letter-spacing:1px;

    color:rgba(190,240,255,.85);

    animation:
    textEnter 1.5s ease 1.3s both;
}


@keyframes textEnter{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* زر المتابعة */

.start{

    margin-top:25px;

    padding:14px 48px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #dff8ff
    );

    color:#0b2a4a;

    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Arial,
    sans-serif;

    font-size:18px;

    font-weight:700;

    letter-spacing:.3px;

    cursor:pointer;

    box-shadow:
    0 0 25px rgba(130,230,255,.25),
    0 12px 35px rgba(0,0,0,.35);

    transition:
    transform .3s ease,
    box-shadow .3s ease;

    animation:
    buttonEnter 1.5s ease 1.7s both;
}


.start:hover{

    transform:
    translateY(-3px)
    scale(1.05);

    box-shadow:
    0 0 40px rgba(100,225,255,.65),
    0 15px 40px rgba(0,0,0,.4);
}


@keyframes buttonEnter{

    from{
        opacity:0;
        transform:
        translateY(20px)
        scale(.9);
    }

    to{
        opacity:1;
        transform:
        translateY(0)
        scale(1);
    }

}


/* الانتقال */

.fadeOut{

    animation:
    pageFadeOut .9s ease forwards;
}

@keyframes pageFadeOut{

    to{
        opacity:0;
        transform:scale(1.03);
    }

}


/* الموبايل */

@media(max-width:600px){

    .photo img{

        width:125%;
        height:100%;

        opacity:.48;

        transform:scale(1.05);
    }

    .text-content{

        margin-top:52vh;
    }

    .title{

        font-size:29px;
    }

    .subtitle{

        font-size:18px;

        line-height:1.7;
    }

    .quote{

        font-size:14px;

        letter-spacing:.5px;
    }

    .start{

        font-size:17px;

        padding:13px 38px;
    }

}


/* الشاشات الكبيرة */

@media(min-width:1000px){

    .photo img{

        width:105%;
        height:105%;

        opacity:.50;
    }

    .text-content{

        margin-top:52vh;
    }

}

</style>

</head>


<body>


<div class="background"></div>

<div class="network"></div>


<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>


<div class="intro">


    <div class="photo">

        <div class="glow"></div>

        <img src="IMG_0684.PNG">

    </div>


    <div class="text-content">


        <div class="title">

            PhysioVision AI – M² Edition

        </div>


        <div class="subtitle">

            من يدٍ صنعت فيّ البداية… إلى حلمٍ صنعناه معًا.

        </div>


        <div class="quote">

            Transforming Movement into Measurable Recovery

        </div>


<button class="start" onclick="startPlatform()">
    متابعة
</button>
</div>


</div>


<script>

function startPlatform(){

    document.body.classList.add("fadeOut");

    setTimeout(function(){

      window.location.href="index.html";
        
    },900);

}

</script>


</body>

</html>
