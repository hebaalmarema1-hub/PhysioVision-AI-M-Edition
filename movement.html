<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>تحليل الحركة - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
margin-bottom:20px;
}

.camera{
width:700px;
max-width:95%;
height:350px;
margin:30px auto;
background:rgba(255,255,255,0.12);
border:3px dashed white;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}

.results{
background:rgba(255,255,255,.12);
width:700px;
max-width:95%;
margin:auto;
padding:25px;
border-radius:20px;
text-align:right;
}

.results p{
font-size:20px;
line-height:2;
}

button{
padding:15px 35px;
margin:15px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.start{
background:#28a745;
color:white;
}

.stop{
background:#dc3545;
color:white;
}

.save{
background:white;
color:#1b6ca8;
}

</style>

</head>

<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>📹 تحليل الحركة</h1>

<p>
PhysioVision AI – M² Edition
</p>

<div class="camera">

🎥 مكان عرض الكاميرا

</div>

<button class="start" onclick="startCamera()">
بدء التحليل
</button>

<button class="stop" onclick="stopCamera()">
إيقاف التحليل
</button>

<div class="results">

<h2>نتائج التحليل</h2>

<p>📐 مدى الحركة (ROM): --</p>

<p>🔁 عدد التكرارات: --</p>

<p>✅ جودة الأداء: --</p>

<p>🤖 ملاحظات الذكاء الاصطناعي: --</p>

</div>

<button class="save">

حفظ النتائج

</button>

</div>
<script>

let video = document.createElement("video");
let cameraBox = document.querySelector(".camera");
let stream;

function startCamera(){

navigator.mediaDevices.getUserMedia({
    video: true
})
.then(function(mediaStream){

    stream = mediaStream;

    video.srcObject = stream;
    video.autoplay = true;

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.borderRadius = "20px";

    cameraBox.innerHTML = "";
    cameraBox.appendChild(video);

})
.catch(function(){

    alert("تعذر تشغيل الكاميرا");

});

}


function stopCamera(){

    if(stream){

        stream.getTracks().forEach(function(track){
            track.stop();
        });

        cameraBox.innerHTML = "🎥 مكان عرض الكاميرا";

    }

}

</script>
</body>

</html>
