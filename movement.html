<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>تحليل الحركة - PhysioVision AI</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
margin-bottom:20px;
}

.camera{
position:relative;
width:700px;
max-width:95%;
height:350px;
margin:30px auto;
background:rgba(255,255,255,0.12);
border:3px dashed white;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.camera video{
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}


.camera canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
}


.results{

background:rgba(255,255,255,.12);
width:700px;
max-width:95%;
margin:auto;
padding:25px;
border-radius:20px;
text-align:right;

}


.results p{

font-size:20px;
line-height:2;

}



button{

padding:15px 35px;
margin:10px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;

}



.start{

background:#28a745;
color:white;

}



.stop{

background:#dc3545;
color:white;

}



.cameraBtn{

background:#ffc107;
color:black;

}



.save{

background:white;
color:#1b6ca8;

}


</style>

</head>
<body>

<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>📹 تحليل الحركة</h1>

<p>
PhysioVision AI – M² Edition
</p>


<div class="results">

<h2>بيانات التقييم</h2>

<p>الحالة: <span id="caseType">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

</div>


<div class="camera">

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

</div>


<button class="start" onclick="startCamera()">
بدء التحليل
</button>


<button class="stop" onclick="stopCamera()">
إيقاف التحليل
</button>


<button class="cameraBtn" onclick="switchCamera()">
🔄 تبديل الكاميرا
</button>



<div class="results">

<h2>نتائج التحليل</h2>


<p>📐 مدى الحركة (ROM): <span id="rom">--</span></p>

<p>🔁 عدد التكرارات: <span id="reps">--</span></p>

<p>✅ جودة الأداء: <span id="quality">--</span></p>

<p>🤖 ملاحظات الذكاء الاصطناعي: <span id="notes">--</span></p>


</div>


<button class="save">
حفظ النتائج
</button>


</div>
<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let frontCamera = true;
let timer = null;
let evaluationData = JSON.parse(localStorage.getItem("evaluationData"));

if(evaluationData){

document.getElementById("caseType").innerHTML = evaluationData.category;

document.getElementById("diagnosis").innerHTML = evaluationData.diagnosis;

document.getElementById("joint").innerHTML = evaluationData.joint;

}


const pose = new Pose({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

}

});



pose.setOptions({

modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5

});



pose.onResults((results)=>{


ctx.clearRect(0,0,canvas.width,canvas.height);


if(results.poseLandmarks){


document.getElementById("notes").innerHTML =
"🧍 تم اكتشاف الجسم";


document.getElementById("quality").innerHTML =
"جيد";


drawConnectors(
ctx,
results.poseLandmarks,
POSE_CONNECTIONS,
{
color:"#00FF00",
lineWidth:4
}
);


drawLandmarks(
ctx,
results.poseLandmarks,
{
color:"#FF0000",
lineWidth:2
}
);


}


});




function startCamera(){


navigator.mediaDevices.getUserMedia({

video:{
facingMode: frontCamera ? "user" : "environment"
}

})


.then((mediaStream)=>{


stream = mediaStream;

video.srcObject = stream;


video.onloadedmetadata = ()=>{


canvas.width = video.videoWidth;

canvas.height = video.videoHeight;



timer = setInterval(()=>{


pose.send({

image:video

});


},100);



};


})


.catch(()=>{

alert("تعذر تشغيل الكاميرا");

});


}





function stopCamera(){


if(stream){

stream.getTracks().forEach(track=>track.stop());

video.srcObject=null;

}


clearInterval(timer);


document.getElementById("notes").innerHTML =
"بانتظار تشغيل التحليل";


}





function switchCamera(){

frontCamera = !frontCamera;

stopCamera();

startCamera();

}



</script>


</body>

</html>
