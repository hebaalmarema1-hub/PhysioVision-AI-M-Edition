<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>تحليل الحركة - PhysioVision AI</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
width:120px;
border-radius:20px;
margin-bottom:20px;
}

.camera{
position:relative;
width:700px;
max-width:95%;
height:350px;
margin:30px auto;
background:rgba(255,255,255,0.12);
border:3px dashed white;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.camera video{
width:100%;
height:100%;
object-fit:cover;
z-index:1;
}

.camera canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
}

.results{
background:rgba(255,255,255,.12);
width:700px;
max-width:95%;
margin:20px auto;
padding:25px;
border-radius:20px;
text-align:right;
}

.results p{
font-size:20px;
line-height:2;
}

button{
padding:15px 35px;
margin:10px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.start{
background:#28a745;
color:white;
}

.stop{
background:#dc3545;
color:white;
}

.cameraBtn{
background:#ffc107;
color:black;
}

.save{
background:white;
color:#1b6ca8;
}

</style>

</head>


<body>


<div class="container">

<img src="IMG_0282.PNG" class="logo">

<h1>📹 تحليل الحركة</h1>

<p>
PhysioVision AI – M² Edition
</p>
<div class="results">

<h2>بيانات التقييم</h2>

<p>الحالة: <span id="caseType">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

</div>


<div class="results">

<h2>اختبار المفصل</h2>

<p id="movementTest">
بانتظار اختيار المفصل...
</p>

</div>


<div class="results">

<h2>اختيار الحركة</h2>

<p id="movementOptions">
بانتظار تحديد المفصل...
</p>

</div>


<div class="camera">

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

</div>


<button class="start" onclick="startCamera()">
بدء التحليل
</button>


<button class="stop" onclick="stopCamera()">
إيقاف التحليل
</button>


<button class="cameraBtn" onclick="switchCamera()">
🔄 تبديل الكاميرا
</button>


<div class="results">

<h2>نتائج التحليل</h2>


<p>📐 مدى الحركة (ROM): <span id="rom">--</span></p>

<p>🔁 عدد التكرارات: <span id="reps">--</span></p>

<p>✅ جودة الأداء: <span id="quality">--</span></p>

<p>🤖 ملاحظات الذكاء الاصطناعي: <span id="notes">--</span></p>


</div>


<button class="save" onclick="saveResults()">
حفظ النتائج
</button>

</div>
<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
  
let stream = null;
let frontCamera = true;
let timer = null;
  let maxROM = 0;
let minROM = 180;
let repetition = 0;
let movingDown = false;
let normalROM = {

"الكوع":150,
"الركبة":135,
"الكتف":180,
"الورك":120,
"الرسغ":80,
"الكاحل":50

};  
let evaluationData = JSON.parse(localStorage.getItem("evaluationData"));


if(evaluationData){

document.getElementById("caseType").innerHTML = evaluationData.category;

document.getElementById("diagnosis").innerHTML = evaluationData.diagnosis;

document.getElementById("joint").innerHTML = evaluationData.joint;

}



let testText = "";

if(evaluationData){

let joint = evaluationData.joint;


if(joint === "الكتف"){

testText = "اختبار الكتف: الثني - البسط - التبعيد - الدوران";

}

else if(joint === "الكوع"){

testText = "اختبار الكوع: الثني والبسط";

}

else if(joint === "الرسغ"){

testText = "اختبار الرسغ: الثني والبسط";

}

else if(joint === "الورك"){

testText = "اختبار الورك: الثني - البسط - التبعيد";

}

else if(joint === "الركبة"){

testText = "اختبار الركبة: ثني ومد الركبة";

}

else if(joint === "الكاحل"){

testText = "اختبار الكاحل: الثني الظهري والثني الأخمصي";

}


document.getElementById("movementTest").innerHTML = testText;

}
  let movementOptions = "";

if(evaluationData){

let joint = evaluationData.joint;


if(joint === "الكتف"){

movementOptions =
"الثني (Flexion) - البسط (Extension) - التبعيد (Abduction) - الدوران الخارجي - الدوران الداخلي";

}

else if(joint === "الكوع"){

movementOptions =
"الثني (Flexion) - البسط (Extension)";

}

else if(joint === "الرسغ"){

movementOptions =
"الثني (Flexion) - البسط (Extension)";

}

else if(joint === "الورك"){

movementOptions =
"الثني (Flexion) - البسط (Extension) - التبعيد (Abduction)";

}

else if(joint === "الركبة"){

movementOptions =
"الثني (Flexion) - البسط (Extension)";

}

else if(joint === "الكاحل"){

movementOptions =
"الثني الظهري (Dorsiflexion) - الثني الأخمصي (Plantarflexion)";

}


document.getElementById("movementOptions").innerHTML = movementOptions;

}


const pose = new Pose({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

}

});


pose.setOptions({

modelComplexity:1,
smoothLandmarks:true,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5

});
  function calculateAngle(a,b,c){

let radians = 
Math.atan2(c.y-b.y,c.x-b.x) -
Math.atan2(a.y-b.y,a.x-b.x);

let angle = Math.abs(radians * 180 / Math.PI);

if(angle > 180){
angle = 360 - angle;
}

return Math.round(angle);

}
  pose.onResults((results)=>{


ctx.clearRect(0,0,canvas.width,canvas.height);


if(results.poseLandmarks){
let landmarks = results.poseLandmarks;


// زاوية الكتف
let shoulderAngle = calculateAngle(
landmarks[11],
landmarks[12],
landmarks[14]
);


// زاوية الكوع
let elbowAngle = calculateAngle(
landmarks[12],
landmarks[14],
landmarks[16]
);


// زاوية الرسغ (تقريبية من نقاط اليد)
let wristAngle = calculateAngle(
landmarks[14],
landmarks[16],
landmarks[20]
);


// زاوية الورك
let hipAngle = calculateAngle(
landmarks[11],
landmarks[23],
landmarks[25]
);


// زاوية الركبة
let kneeAngle = calculateAngle(
landmarks[24],
landmarks[26],
landmarks[28]
);


// زاوية الكاحل
let ankleAngle = calculateAngle(
landmarks[26],
landmarks[28],
landmarks[32]
);


let selectedJoint = evaluationData.joint;

if(selectedJoint === "الكتف"){

document.getElementById("rom").innerHTML =
"زاوية الكتف: " + shoulderAngle + "°";

}

else if(selectedJoint === "الكوع"){

document.getElementById("rom").innerHTML =
"زاوية الكوع: " + elbowAngle + "°";

}

else if(selectedJoint === "الرسغ"){

document.getElementById("rom").innerHTML =
"زاوية الرسغ: " + wristAngle + "°";

}

else if(selectedJoint === "الورك"){

document.getElementById("rom").innerHTML =
"زاوية الورك: " + hipAngle + "°";

}

else if(selectedJoint === "الركبة"){

document.getElementById("rom").innerHTML =
"زاوية الركبة: " + kneeAngle + "°";

}

else if(selectedJoint === "الكاحل"){

document.getElementById("rom").innerHTML =
"زاوية الكاحل: " + ankleAngle + "°";

}
let currentAngle = 0;

if(selectedJoint === "الكتف"){
currentAngle = shoulderAngle;
}

else if(selectedJoint === "الكوع"){
currentAngle = elbowAngle;
}

else if(selectedJoint === "الرسغ"){
currentAngle = wristAngle;
}

else if(selectedJoint === "الورك"){
currentAngle = hipAngle;
}

else if(selectedJoint === "الركبة"){
currentAngle = kneeAngle;
}

else if(selectedJoint === "الكاحل"){
currentAngle = ankleAngle;
}


if(currentAngle > maxROM){
maxROM = currentAngle;
}

if(currentAngle < minROM){
minROM = currentAngle;
}


document.getElementById("rom").innerHTML =
"مدى الحركة: " + (maxROM - minROM) + "°";
 let normal = normalROM[selectedJoint];

let performance = "";

if((maxROM - minROM) >= normal * 0.9){

performance = "ممتاز";

}

else if((maxROM - minROM) >= normal * 0.6){

performance = "جيد";

}

else{

performance = "ضعيف";

}


document.getElementById("quality").innerHTML =
performance;

// حساب التكرارات حسب المفصل

let minAngle = 0;
let maxAngle = 0;


if(selectedJoint === "الكوع"){

minAngle = 60;
maxAngle = 140;

}

else if(selectedJoint === "الركبة"){

minAngle = 70;
maxAngle = 160;

}

else if(selectedJoint === "الكتف"){

minAngle = 60;
maxAngle = 150;

}

else if(selectedJoint === "الورك"){

minAngle = 60;
maxAngle = 130;

}

else if(selectedJoint === "الرسغ"){

minAngle = 40;
maxAngle = 80;

}

else if(selectedJoint === "الكاحل"){

minAngle = 30;
maxAngle = 60;

}

// ملاحظات الذكاء الاصطناعي

let aiNote = "";

if(performance === "ممتاز"){

aiNote = "✅ الحركة ممتازة والمدى الحركي قريب من الطبيعي";

}

else if(performance === "جيد"){

aiNote = "⚠️ الحركة جيدة لكن يوجد نقص بسيط في المدى الحركي";

}

else if(performance === "ضعيف"){

aiNote = "❌ يوجد محدودية في الحركة ويحتاج إلى برنامج تأهيلي";

}


if(currentAngle < 60){

aiNote += " | ⚠️ زاوية الحركة منخفضة";

}


if(repetition > 0){

aiNote += " | 🔁 تم تسجيل " + repetition + " تكرار";

}


document.getElementById("notes").innerHTML =
"🤖 " + aiNote;

if(currentAngle < minAngle){

movingDown = true;

}


if(currentAngle > maxAngle && movingDown === true){

repetition++;

movingDown = false;

}


document.getElementById("reps").innerHTML =
"عدد التكرارات: " + repetition;


drawConnectors(
ctx,
results.poseLandmarks,
POSE_CONNECTIONS,
{
color:"#00FF00",
lineWidth:4
}
);


drawLandmarks(
ctx,
results.poseLandmarks,
{
color:"#FF0000",
lineWidth:2
}
);


}


});



function startCamera(){


navigator.mediaDevices.getUserMedia({

video:{
facingMode: frontCamera ? "user" : "environment"
}

})


.then((mediaStream)=>{


stream = mediaStream;

video.srcObject = stream;


video.onloadedmetadata = ()=>{


canvas.width = video.videoWidth;

canvas.height = video.videoHeight;


timer = setInterval(()=>{


pose.send({

image:video

});


},100);



};


})


.catch(()=>{

alert("تعذر تشغيل الكاميرا");

});


}



function stopCamera(){


if(stream){

stream.getTracks().forEach(track=>track.stop());

video.srcObject=null;

}


clearInterval(timer);


document.getElementById("notes").innerHTML =
"بانتظار تشغيل التحليل";


}



function saveResults(){

alert("تم الضغط على حفظ النتائج");

let resultData = {

...evaluationData,

rom: maxROM - minROM,

reps: repetition,

quality: document.getElementById("quality").innerText,

notes: document.getElementById("notes").innerText

};

localStorage.setItem("resultData", JSON.stringify(resultData));

window.location.href="rehab.html";

}
</script>


</body>

</html>
