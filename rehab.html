<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>البرنامج التأهيلي - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.card{
background:rgba(255,255,255,.12);
width:700px;
max-width:95%;
margin:20px auto;
padding:25px;
border-radius:20px;
text-align:right;
}

h1{
margin-bottom:30px;
}

p{
font-size:20px;
line-height:2;
}

</style>

</head>

<body>

<div class="container">

<h1>🏥 البرنامج التأهيلي المقترح</h1>

<div class="card">

<h2>بيانات الحالة</h2>

<p>الحالة: <span id="caseType">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

<p>مدى الحركة: <span id="rom">--</span></p>

<p>التقييم: <span id="quality">--</span></p>

<p>عدد التكرارات: <span id="reps">--</span></p>

<p>ملاحظات الذكاء الاصطناعي: <span id="notes">--</span></p>

</div>

<div class="card">

<h2>📋 البرنامج التأهيلي</h2>

<div id="rehabPlan">

بانتظار تحميل البرنامج...

</div>

</div>

</div>

<script>

let resultData = JSON.parse(localStorage.getItem("resultData"));

if(resultData){

document.getElementById("caseType").innerHTML=resultData.category;

document.getElementById("diagnosis").innerHTML=resultData.diagnosis;

document.getElementById("joint").innerHTML=resultData.joint;

document.getElementById("rom").innerHTML=resultData.rom+"°";

document.getElementById("quality").innerHTML=resultData.quality;

document.getElementById("reps").innerHTML=resultData.reps;

document.getElementById("notes").innerHTML=resultData.notes;


// قاعدة البروتوكولات

const rehabProtocols = {
"إصابة أوتار الكتف": {

goals:[
"تقليل الألم",
"تحسين مدى حركة الكتف",
"زيادة قوة عضلات الكفة المدورة",
"تحسين ثبات المفصل"
],

electrotherapy:[
"TENS لتخفيف الألم حسب الحالة",
"NMES لتحفيز وتقوية العضلات الضعيفة"
],

exercises:[
"تمارين مدى الحركة للكتف",
"تمارين Pendulum",
"تمارين تقوية الكفة المدورة",
"تمارين مقاومة باستخدام الشريط المطاطي",
"تمارين ثبات الكتف"
],

devices:[
"Pulley جهاز البكرة",
"TheraBand شريط مقاومة",
"أوزان خفيفة",
"جهاز تحفيز كهربائي عند الحاجة"
],

notes:
"تجنب رفع الأوزان الثقيلة والحركات التي تزيد الألم"
},
"إصابة أوتار الرسغ": {

goals:[
"تقليل الألم والالتهاب",
"تحسين مدى حركة الرسغ",
"زيادة قوة عضلات اليد والقبضة",
"استعادة الوظيفة اليومية"
],

electrotherapy:[
"TENS لتخفيف الألم حسب الحالة",
"NMES عند وجود ضعف عضلي"
],

exercises:[
"تمارين مدى الحركة للرسغ",
"تمارين ثني ومد الرسغ",
"تمارين تقوية القبضة",
"تمارين مقاومة باستخدام الشريط المطاطي",
"تمارين وظيفية لليد"
],

devices:[
"Hand Gripper جهاز تقوية القبضة",
"كرة علاجية",
"TheraBand شريط مقاومة",
"أوزان خفيفة"
],

notes:
"تجنب الضغط الزائد على الرسغ وتدرج في المقاومة"
},
"إصابة أوتار الورك": {

goals:[
"تقليل الألم",
"تحسين حركة مفصل الورك",
"تقوية عضلات الحوض",
"تحسين المشي والوظيفة"
],

electrotherapy:[
"TENS لتخفيف الألم حسب الحاجة",
"NMES عند وجود ضعف عضلي"
],

exercises:[
"تمارين مدى الحركة للورك",
"تمارين تقوية عضلات الحوض",
"تمارين الجسر (Bridge)",
"تمارين توازن",
"تمارين وظيفية للمشي"
],

devices:[
"دراجة ثابتة",
"TheraBand شريط مقاومة",
"أوزان خفيفة",
"جهاز مقاومة"
],

notes:
"تدرج في التمارين وتجنب الحركات التي تسبب ألم شديد"

},
"إصابة أوتار الركبة": {

goals:[
"تقليل الألم",
"تحسين مدى حركة الركبة",
"تقوية العضلة الرباعية وعضلات الفخذ",
"تحسين الثبات والوظيفة"
],

electrotherapy:[
"TENS لتخفيف الألم",
"NMES لتحفيز وتقوية العضلة الرباعية عند الحاجة"
],

exercises:[
"تمارين مدى الحركة للركبة",
"تمارين تقوية العضلة الرباعية",
"تمارين Isometric",
"تمارين مقاومة تدريجية",
"تمارين توازن وتحكم"
],

devices:[
"دراجة ثابتة",
"Leg Press حسب الحالة",
"TheraBand شريط مقاومة",
"أوزان خفيفة"
],

notes:
"يجب زيادة الحمل تدريجياً وتجنب الألم أثناء التمرين"

},  
"إصابة أوتار الكاحل": {

goals:[
"تقليل الألم والتورم",
"تحسين مدى حركة الكاحل",
"تقوية عضلات الساق",
"تحسين التوازن والمشي"
],

electrotherapy:[
"TENS لتخفيف الألم حسب الحالة",
"NMES عند وجود ضعف عضلي"
],

exercises:[
"تمارين حركة الكاحل",
"تمارين تقوية عضلات الساق",
"تمارين مقاومة بالشريط المطاطي",
"تمارين توازن",
"تمارين المشي التدريجي"
],

devices:[
"Balance Board لوح التوازن",
"TheraBand شريط مقاومة",
"كرة علاجية",
"جهاز مقاومة"
],

notes:
"تجنب التحميل الزائد خاصة في المراحل الأولى من الإصابة"

},  
"إصابة أوتار الكوع": {

goals:[
"تقليل الألم",
"تحسين مدى الحركة",
"زيادة القوة العضلية"
],

electrotherapy:[
"TENS لتخفيف الألم",
"NMES عند وجود ضعف عضلي"
],

exercises:[
"تمارين مدى الحركة للكوع",
"تمارين تقوية عضلات الذراع",
"تمارين مقاومة تدريجية",
"تمارين وظيفية"
],

devices:[
"شريط مقاومة",
"أوزان خفيفة",
"جهاز تحفيز كهربائي"
],

notes:
"تجنب الحركات التي تسبب ألم شديد"

}

};


// البحث عن البروتوكول

let key = 
(resultData.diagnosis + " " + resultData.joint)
.replace("ال","");


let selectedPlan = null;


for(let protocol in rehabProtocols){

if(key.includes(protocol.replace(" ","")) || 
key.includes(protocol)){

selectedPlan = rehabProtocols[protocol];

}

}


// عرض الخطة

if(selectedPlan){

document.getElementById("rehabPlan").innerHTML = `

<h3>🎯 أهداف العلاج</h3>
<p>${selectedPlan.goals.join("<br>")}</p>


<h3>⚡ العلاج الكهربائي</h3>
<p>${selectedPlan.electrotherapy.join("<br>")}</p>


<h3>🏃 التمارين</h3>
<p>${selectedPlan.exercises.join("<br>")}</p>


<h3>🏋️ الأجهزة المستخدمة</h3>
<p>${selectedPlan.devices.join("<br>")}</p>


<h3>⚠️ ملاحظات</h3>
<p>${selectedPlan.notes}</p>

`;

}

else{

document.getElementById("rehabPlan").innerHTML =
"لم يتم العثور على بروتوكول مناسب لهذه الحالة حالياً";

}

}
</script>

</body>

</html>
