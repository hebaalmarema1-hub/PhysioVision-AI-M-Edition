<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>البرنامج التأهيلي - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.card{
background:rgba(255,255,255,.12);
width:700px;
max-width:95%;
margin:20px auto;
padding:25px;
border-radius:20px;
text-align:right;
}

h1{
margin-bottom:30px;
}

p{
font-size:20px;
line-height:2;
}

</style>

</head>

<body>

<div class="container">

<h1>🏥 البرنامج التأهيلي المقترح</h1>

<div class="card">

<h2>بيانات الحالة</h2>

<p>الحالة: <span id="caseType">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

<p>مدى الحركة: <span id="rom">--</span></p>

<p>التقييم: <span id="quality">--</span></p>

<p>عدد التكرارات: <span id="reps">--</span></p>

<p>ملاحظات الذكاء الاصطناعي: <span id="notes">--</span></p>

</div>

<div class="card">

<h2>📋 البرنامج التأهيلي</h2>

<div id="rehabPlan">

بانتظار تحميل البرنامج...

</div>

</div>

</div>

<script>

let resultData = JSON.parse(localStorage.getItem("resultData"));

if(resultData){

document.getElementById("caseType").innerHTML=resultData.category;

document.getElementById("diagnosis").innerHTML=resultData.diagnosis;

document.getElementById("joint").innerHTML=resultData.joint;

document.getElementById("rom").innerHTML=resultData.rom+"°";

document.getElementById("quality").innerHTML=resultData.quality;

document.getElementById("reps").innerHTML=resultData.reps;

document.getElementById("notes").innerHTML=resultData.notes;

}
let plan = "";

if(resultData.joint.includes("كوع")){

plan = `
<h3>خطة تأهيل الكوع</h3>
<p>
المرحلة: تحسين القوة والمحافظة على الحركة<br><br>

التمارين:<br>
✅ تمارين مدى الحركة للكوع<br>
✅ تقوية عضلات الذراع<br>
✅ تمارين مقاومة تدريجية<br>
✅ تمارين وظيفية<br><br>

الأجهزة:<br>
- شريط مقاومة<br>
- أوزان خفيفة<br>
- جهاز تحفيز كهربائي عند الحاجة
</p>
`;

}

else if(resultData.joint.includes("رسغ")){

plan = `
<h3>خطة تأهيل الرسغ</h3>
<p>
التمارين:<br>
✅ تمارين حركة الرسغ<br>
✅ تقوية القبضة<br>
✅ تمارين مقاومة<br><br>

الأجهزة:<br>
- كرة علاجية<br>
- Hand gripper<br>
- شريط مقاومة
</p>
`;

}

else if(resultData.joint.includes("كتف")){

plan = `
<h3>خطة تأهيل الكتف</h3>
<p>
التمارين:<br>
✅ تمارين مدى الحركة<br>
✅ تقوية الكفة المدورة<br>
✅ تمارين ثبات الكتف<br><br>

الأجهزة:<br>
- Pulley<br>
- شريط مقاومة<br>
- أوزان خفيفة
</p>
`;

}

else if(resultData.joint.includes("ورك")){

plan = `
<h3>خطة تأهيل الورك</h3>
<p>
التمارين:<br>
✅ تقوية عضلات الحوض<br>
✅ تمارين توازن<br>
✅ تدريب المشي<br><br>

الأجهزة:<br>
- دراجة ثابتة<br>
- جهاز مقاومة
</p>
`;

}

else if(resultData.joint.includes("ركبة")){

plan = `
<h3>خطة تأهيل الركبة</h3>
<p>
التمارين:<br>
✅ تمارين مدى الحركة<br>
✅ تقوية العضلة الرباعية<br>
✅ تمارين توازن<br><br>

الأجهزة:<br>
- دراجة ثابتة<br>
- جهاز مقاومة
</p>
`;

}

else if(resultData.joint.includes("كاحل")){

plan = `
<h3>خطة تأهيل الكاحل</h3>
<p>
التمارين:<br>
✅ تمارين حركة الكاحل<br>
✅ تقوية عضلات الساق<br>
✅ تمارين توازن<br><br>

الأجهزة:<br>
- Balance board<br>
- شريط مقاومة
</p>
`;

}

document.getElementById("rehabPlan").innerHTML = plan;
</script>

</body>

</html>
