<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>البرنامج التأهيلي - PhysioVision AI</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
padding:30px;
}

.card{
background:#ffffff22;
padding:25px;
border-radius:20px;
max-width:700px;
margin:auto;
text-align:right;
}

</style>

</head>


<body>


<h1>🏥 البرنامج التأهيلي المقترح</h1>


<div class="card">

<p>نوع الحالة: <span id="category">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>الألم: <span id="pain">--</span></p>

<hr>

<h2>📝 الخطة</h2>

<div id="plan">
جاري التحميل...
</div>

</div>



<script>


const rehabPrograms={

"خشونة الركبة":{
goals:[
"تقليل الألم",
"زيادة مدى الحركة",
"تقوية العضلة الرباعية"
],

exercises:[
"Straight leg raise",
"Quadriceps setting",
"تمارين التوازن"
],

duration:"8 أسابيع"
},


"إصابات الركبة":{
goals:[
"تقليل الألم والتورم",
"استعادة مدى حركة الركبة",
"تقوية عضلات الفخذ"
],

exercises:[
"Straight leg raise",
"Quadriceps setting",
"تمارين مدى الحركة ROM",
"تمارين التوازن"
],

duration:"6 - 8 أسابيع"
},

"إصابات الكتف":{

goals:[
"تقليل الألم",
"استعادة مدى حركة الكتف",
"تقوية عضلات الكتف ولوح الكتف"
],

exercises:[
"تمرين البندول Pendulum",
"رفع الذراع للأمام Shoulder flexion",
"رفع الذراع للجانب Shoulder abduction",
"تمارين الشريط المطاطي",
"تمارين الثبات والتحكم"
],

duration:"8 أسابيع"
}
};



// قراءة النتائج

let saved = localStorage.getItem("resultData");


if(saved){


let data=JSON.parse(saved);


document.getElementById("category").innerHTML =
data.category || "--";


document.getElementById("diagnosis").innerHTML =
data.diagnosis || "--";


document.getElementById("pain").innerHTML =
data.pain || "--";



let program =
rehabPrograms[data.diagnosis] ||
rehabPrograms[data.category];



if(program){


document.getElementById("plan").innerHTML=`

<h3>🎯 الأهداف</h3>

${program.goals.join("<br>")}


<h3>🏃 التمارين</h3>

${program.exercises.join("<br>")}


<h3>📅 المدة</h3>

${program.duration}

`;

}

else{

document.getElementById("plan").innerHTML=
"لا يوجد برنامج لهذه الحالة";

}


}

else{


document.getElementById("plan").innerHTML=
"لا توجد نتائج محفوظة";

}



</script>


</body>

</html>
