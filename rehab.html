<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>البرنامج التأهيلي - PhysioVision AI</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.card{

background:rgba(255,255,255,.15);
max-width:700px;
margin:20px auto;
padding:25px;
border-radius:20px;
text-align:right;

}

p{
font-size:18px;
line-height:2;
}

</style>

</head>


<body>

<div class="container">


<h1>🏥 البرنامج التأهيلي المقترح</h1>


<div class="card">

<h2>📋 بيانات الحالة</h2>


<p>نوع الحالة: <span id="category">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

<p>درجة الألم: <span id="pain">--</span></p>

<p>قوة العضلة: <span id="strength">--</span></p>

<p>مدى الحركة: <span id="rom">--</span></p>

<p>عدد التكرارات: <span id="reps">--</span></p>

<p>جودة الأداء: <span id="quality">--</span></p>

<p>ملاحظات الذكاء الاصطناعي:
<span id="aiNotes">--</span>
</p>


</div>


<div class="card">

<h2>📝 الخطة التأهيلية</h2>

<div id="plan">
جاري إنشاء الخطة...
</div>


</div>



<script>


let data = JSON.parse(localStorage.getItem("resultData"));


if(data){


document.getElementById("category").innerHTML =
data.category || "--";


document.getElementById("diagnosis").innerHTML =
data.diagnosis || "--";


document.getElementById("joint").innerHTML =
data.joint || "--";


document.getElementById("pain").innerHTML =
data.pain || "--";


document.getElementById("strength").innerHTML =
data.muscleStrength || "--";


document.getElementById("rom").innerHTML =
data.rom + " درجة";


document.getElementById("reps").innerHTML =
data.reps;


document.getElementById("quality").innerHTML =
data.quality;


document.getElementById("aiNotes").innerHTML =
data.notes;



let plan="";


if(data.diagnosis==="خشونة الركبة"){

plan=
`
✅ تقليل الألم<br>
✅ تمارين مدى الحركة ROM<br>
✅ تقوية العضلة الرباعية<br>
✅ تمارين التوازن<br>
✅ دراجة ثابتة حسب الحالة
`;

}

else if(data.diagnosis==="آلام أسفل الظهر"){

plan=
`
✅ تمارين McKenzie<br>
✅ تقوية عضلات Core<br>
✅ تمارين الإطالة<br>
✅ تحسين الوضعية
`;

}

else{

plan=
`
✅ تحسين مدى الحركة<br>
✅ تقوية العضلات<br>
✅ تمارين وظيفية<br>
✅ متابعة تطور الحالة
`;

}



document.getElementById("plan").innerHTML=plan;



}

else{


document.getElementById("plan").innerHTML=
"لا توجد بيانات محفوظة";

}



</script>


</body>

</html>
