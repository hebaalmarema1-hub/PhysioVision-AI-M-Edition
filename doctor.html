<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhysioVision AI – M² Edition</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
    "Segoe UI",
    "Noto Sans Arabic",
    Arial,
    sans-serif;

    background:
    radial-gradient(
        circle at 50% 40%,
        #1b6ca8 0%,
        #102d52 45%,
        #061426 100%
    );

    color:white;
}


/* =========================
   الخلفية
========================= */

.background{

    position:absolute;
    inset:0;

    background:

    radial-gradient(
        circle at 20% 25%,
        rgba(0,220,255,.18),
        transparent 32%
    ),

    radial-gradient(
        circle at 80% 75%,
        rgba(0,130,255,.20),
        transparent 35%
    );

    animation:
    backgroundPulse 8s ease-in-out infinite;
}


@keyframes backgroundPulse{

    0%,100%{
        opacity:.75;
    }

    50%{
        opacity:1;
    }

}


/* =========================
   شبكة الذكاء الاصطناعي
========================= */

.network{

    position:absolute;
    inset:-100px;

    opacity:.12;

    background-image:

    linear-gradient(
        90deg,
        transparent 49%,
        rgba(130,230,255,.18) 50%,
        transparent 51%
    ),

    linear-gradient(
        0deg,
        transparent 49%,
        rgba(130,230,255,.12) 50%,
        transparent 51%
    );

    background-size:90px 90px;

    animation:
    moveGrid 20s linear infinite;
}


@keyframes moveGrid{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(90px,90px);
    }

}


/* =========================
   النقاط المضيئة
========================= */

.particle{

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#9befff;

    box-shadow:
    0 0 10px #63e5ff,
    0 0 25px #20bfff;

    animation:
    particleFloat 7s ease-in-out infinite;
}


.p1{
    top:15%;
    left:12%;
}

.p2{
    top:30%;
    left:86%;
    animation-delay:1s;
}

.p3{
    top:75%;
    left:10%;
    animation-delay:2s;
}

.p4{
    top:82%;
    left:88%;
    animation-delay:3s;
}

.p5{
    top:12%;
    left:72%;
    animation-delay:4s;
}

.p6{
    top:55%;
    left:5%;
    animation-delay:2.5s;
}

.p7{
    top:48%;
    left:94%;
    animation-delay:4.5s;
}


@keyframes particleFloat{

    0%,100%{

        transform:
        translateY(0)
        scale(1);

        opacity:.2;
    }

    50%{

        transform:
        translateY(-25px)
        scale(1.5);

        opacity:.9;
    }

}


/* =========================
   صورة الدكتورة
========================= */

.photo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:1;

    pointer-events:none;

    overflow:hidden;
}


.photo img{

    width:125%;
    height:125%;

    object-fit:contain;

    opacity:.35;

    transform:scale(1.05);

    filter:

        saturate(.85)

        contrast(.95)

        drop-shadow(
            0 0 35px
            rgba(70,220,255,.25)
        )

        drop-shadow(
            0 25px 60px
            rgba(0,0,0,.45)
        );


    -webkit-mask-image:

        radial-gradient(
            ellipse at center,
            black 30%,
            rgba(0,0,0,.8) 60%,
            transparent 90%
        );


    mask-image:

        radial-gradient(
            ellipse at center,
            black 30%,
            rgba(0,0,0,.8) 60%,
            transparent 90%
        );


    animation:
    photoEnter 2s ease both,
    photoFloat 8s ease-in-out 2s infinite;
}


@keyframes photoEnter{

    from{

        opacity:0;

        transform:
        scale(1.15);

        filter:
        blur(15px);
    }

    to{

        opacity:.35;

        transform:
        scale(1.05);

        filter:
        blur(0);
    }

}


@keyframes photoFloat{

    0%,100%{

        transform:
        scale(1.05)
        translateY(0);
    }

    50%{

        transform:
        scale(1.08)
        translateY(-7px);
    }

}


/* =========================
   الهالة خلف الصورة
========================= */

.glow{

    position:absolute;

    width:75%;
    height:70%;

    background:

    radial-gradient(
        circle,
        rgba(40,215,255,.35),
        rgba(30,130,255,.12),
        transparent 70%
    );

    filter:blur(70px);

    opacity:.35;

    border-radius:50%;

    z-index:-1;

    animation:
    glowPulse 6s ease-in-out infinite;
}


@keyframes glowPulse{

    0%,100%{

        transform:scale(.95);

        opacity:.25;
    }

    50%{

        transform:scale(1.08);

        opacity:.45;
    }

}


/* =========================
   طبقة فوق الصورة
========================= */

.photo::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    linear-gradient(
        to bottom,
        rgba(6,20,38,.05),
        rgba(6,20,38,.15) 45%,
        rgba(6,20,38,.82) 100%
    );

    pointer-events:none;
}


/* =========================
   المحتوى
========================= */

.content{

    position:relative;

    z-index:10;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-end;

    text-align:center;

    padding:
    0 20px 55px;
}


/* =========================
   اسم المنصة
========================= */

.title{

    font-size:
    clamp(30px,5vw,58px);

    font-weight:700;

    line-height:1.3;

    margin:0;

    text-shadow:
    0 4px 25px
    rgba(0,0,0,.7);

    animation:
    textEnter 1.5s ease .5s both;
}


/* =========================
   العبارة
========================= */

.subtitle{

    margin-top:12px;

    font-size:
    clamp(18px,2.6vw,30px);

    font-weight:500;

    line-height:1.8;

    color:
    rgba(255,255,255,.95);

    text-shadow:
    0 3px 18px
    rgba(0,0,0,.7);

    animation:
    textEnter 1.5s ease .8s both;
}


/* =========================
   العبارة الإنجليزية
========================= */

.quote{

    margin-top:8px;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:
    clamp(14px,1.8vw,21px);

    letter-spacing:1px;

    color:
    rgba(190,240,255,.9);

    text-shadow:
    0 2px 15px
    rgba(0,0,0,.8);

    animation:
    textEnter 1.5s ease 1.1s both;
}


@keyframes textEnter{

    from{

        opacity:0;

        transform:
        translateY(25px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }

}


/* =========================
   زر المتابعة
========================= */

.start{

    margin-top:22px;

    padding:
    14px 48px;

    border:none;

    border-radius:50px;

    background:

    linear-gradient(
        135deg,
        #ffffff,
        #dff8ff
    );

    color:#0b2a4a;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    box-shadow:

    0 0 25px
    rgba(130,230,255,.3),

    0 12px 35px
    rgba(0,0,0,.4);

    transition:.3s;

    animation:
    buttonEnter 1.5s ease 1.4s both;
}


.start:hover{

    transform:
    translateY(-4px)
    scale(1.05);

    box-shadow:

    0 0 40px
    rgba(100,225,255,.65),

    0 15px 40px
    rgba(0,0,0,.45);
}


@keyframes buttonEnter{

    from{

        opacity:0;

        transform:
        translateY(20px)
        scale(.9);
    }

    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }

}


/* =========================
   انتقال
========================= */

.fadeOut{

    animation:
    pageFadeOut .7s ease forwards;
}


@keyframes pageFadeOut{

    to{

        opacity:0;

        transform:
        scale(1.03);
    }

}


/* =========================
   الهاتف
========================= */

@media(max-width:600px){

    .photo{

        left:0;
        right:0;

        width:100%;
        height:100%;

        display:flex;

        align-items:center;
        justify-content:center;

        overflow:hidden;
    }


    .photo img{

        width:120%;
        height:120%;

        max-width:none;
        max-height:none;

        object-fit:contain;

        opacity:.32;

        transform:scale(1);
    }


    .content{

        padding:
        0 15px 35px;
    }


    .title{

        font-size:30px;
    }


    .subtitle{

        font-size:18px;

        line-height:1.7;
    }


    .quote{

        font-size:14px;
    }


    .start{

        font-size:17px;

        padding:
        13px 40px;
    }

}


/* =========================
   اللابتوب والشاشات الكبيرة
========================= */

@media(min-width:1000px){

    .photo img{

        width:130%;
        height:130%;

        opacity:.38;
    }


    .content{

        padding-bottom:65px;
    }

}

</style>

</head>


<body>


<!-- الخلفية -->

<div class="background"></div>

<div class="network"></div>


<!-- النقاط -->

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>
<div class="particle p7"></div>


<!-- صورة الدكتورة -->

<div class="photo">

    <div class="glow"></div>

    <img
        src="IMG_0684.PNG"
        alt="PhysioVision AI">

</div>


<!-- المحتوى -->

<div class="content">

    <div class="title">

        PhysioVision AI – M² Edition

    </div>


    <div class="subtitle">

        من يدٍ صنعت فيّ البداية… إلى حلمٍ صنعناه معًا.

    </div>


    <div class="quote">

        Transforming Movement into Measurable Recovery

    </div>


    <button
        class="start"
        onclick="startPlatform()">

        متابعة

    </button>

</div>


<script>

function startPlatform(){

    document.body.classList.add("fadeOut");

    setTimeout(function(){

        window.location.href =
        "login.html";

    },700);

}

</script>


</body>

</html>
