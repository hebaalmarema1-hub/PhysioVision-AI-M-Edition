<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>التقارير - PhysioVision AI</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0b1f3a,#1b6ca8);
color:white;
text-align:center;
padding:30px;
}

.card{
background:#ffffff22;
padding:25px;
border-radius:20px;
max-width:800px;
margin:20px auto;
text-align:right;
}

h1{
font-size:35px;
}

h2{
border-bottom:1px solid white;
padding-bottom:10px;
}

p{
font-size:18px;
line-height:2;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>


<body>


<h1>📊 تقرير الحالة - PhysioVision AI</h1>


<div class="card">

<h2>👤 بيانات الحالة</h2>

<p>نوع الحالة: <span id="category">--</span></p>

<p>التشخيص: <span id="diagnosis">--</span></p>

<p>المفصل: <span id="joint">--</span></p>

<p>درجة الألم: <span id="pain">--</span></p>


</div>



<div class="card">

<h2>🤖 تحليل الحركة</h2>

<p>قوة العضلة: <span id="strength">--</span></p>

<p>مدى الحركة ROM: <span id="rom">--</span></p>

<p>عدد التكرارات: <span id="reps">--</span></p>

<p>جودة الأداء: <span id="quality">--</span></p>

<p>ملاحظات الذكاء الاصطناعي: <span id="notes">--</span></p>


</div>



<div class="card">

<h2>🏥 البرنامج التأهيلي</h2>

<div id="plan">

لا توجد خطة

</div>

</div>



<button onclick="window.print()">
🖨️ طباعة التقرير
</button>



<script>


let saved = localStorage.getItem("resultData");


if(saved){


let data = JSON.parse(saved);



document.getElementById("category").innerHTML =
data.category || "--";


document.getElementById("diagnosis").innerHTML =
data.diagnosis || "--";


document.getElementById("joint").innerHTML =
data.joint || "--";


document.getElementById("pain").innerHTML =
data.pain || "--";


document.getElementById("strength").innerHTML =
data.muscleStrength || "--";


document.getElementById("rom").innerHTML =
data.rom || "--";


document.getElementById("reps").innerHTML =
data.reps || "--";


document.getElementById("quality").innerHTML =
data.quality || "--";


document.getElementById("notes").innerHTML =
data.notes || "--";



document.getElementById("plan").innerHTML =
data.plan || "يتم إنشاؤها من البرنامج التأهيلي";


}

else{


document.body.innerHTML +=

"<h2>لا توجد بيانات محفوظة</h2>";

}


</script>


</body>

</html>
